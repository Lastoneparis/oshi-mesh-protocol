name: ci
on: [push, pull_request]
jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vectors are reproducible and match the spec
        run: python tools/make_vectors.py && git diff --exit-code vectors c/test/vectors.h
      - name: Python reference codec
        run: pip install pytest && cd python && python -m pytest -q tests
      - name: C++ reference codec
        run: cd c/test && c++ -std=c++17 -Wall -Wextra -Werror -I.. ../oshi_omp.cpp test_vectors.cpp -o t && ./t
