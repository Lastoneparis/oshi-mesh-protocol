[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oshi-omp"
version = "1.0.0"
description = "Reference codec for the OSHI Mesh Protocol (OMP) v1 and its OB envelope for MeshCore"
readme = "../README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Oshi Lab"}]
keywords = ["lora", "mesh", "meshtastic", "meshcore", "protocol", "omp", "oshi"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Communications"]

[project.urls]
Homepage = "https://github.com/Lastoneparis/oshi-mesh-protocol"

[tool.setuptools]
packages = ["oshi_omp"]

[tool.pytest.ini_options]
pythonpath = ["."]
